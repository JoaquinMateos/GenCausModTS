[project]
name = "gcmts"
version = "0.1.0"
description = "A benchmark library for generative causal modelling of time series: identifiable causal representation learning, counterfactual and treatment-effect estimation, and static-dynamic disentanglement."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
authors = [
    { name = "Joaquín Mateos", email = "joaquin.mateos@uco.es" },
    { name = "Antonio R. Moya", email = "amoya@uco.es" },
    { name = "Sebastián Ventura", email = "sventura@uco.es" },
]
keywords = [
    "causal inference",
    "time series",
    "representation learning",
    "counterfactuals",
    "disentanglement",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "torch>=2.5",
    "lightning>=2.4",
    "scikit-learn>=1.5",
    "networkx>=3.3",
    "pandas>=2.2",
    "pydantic>=2.9",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.urls]
Repository = "https://github.com/JoaquinMateos/GenCausModTS"
Issues = "https://github.com/JoaquinMateos/GenCausModTS/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gcmts"]

[tool.uv]
package = true
managed = true

[tool.uv.pip]
python-version = "3.14"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["N803", "N806", "N812"]  # allow mixedCase/`F` for math/PyTorch notation

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "requires_gpu: marks tests that need a CUDA/MPS device",
]

[tool.coverage.run]
source = ["src/gcmts"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
